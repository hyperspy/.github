default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(scripts|tests)/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^README\.md$
  - repo: local
    hooks:
      - id: interim-ai-co-author-guard
        name: Block AI Co-authored-by (interim)
        language: pygrep
        entry: '^Co-authored-by:.*(claude|copilot|cursor|codex|gemini|aider|cline|windsurf|opencode|anthropic|openai|gpt|qwen|deepseek|mistral)'
        args: [-i]
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: check-ai-co-author
        name: Block Co-authored-by AI trailers
        language: script
        entry: scripts/check-ai-co-author.py
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
      - id: check-agents-policy
        name: Pin the HyperSpy AI policy block in AGENTS.md
        language: script
        entry: scripts/check-agents-policy.py
        files: ^AGENTS\.md$
        pass_filenames: true
        args: [--fix, --policy, AI-POLICY.md]
